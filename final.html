<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <script src="Common/webgl-utils.js"></script>
    <script src="Common/initShaders.js"></script>
    <script src="Common/MV.js"></script>

</head>
<script id="vertex-shader" type="x-shader/x-vertex"> 
attribute vec3 aPosition;
uniform mat4 uModel;
uniform mat4 uView;
uniform mat4 uProj;

void main() {
    gl_Position = uProj * uView * uModel * vec4(aPosition, 1.0); // get clip-space coords 
}
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;

void main() {
    gl_FragColor = vec4(0.3, 0.8, 0.3, 1.0);
}
</script>
<body>
    <canvas id="gl-canvas" width="1024" height="1024"></canvas>
    
    <script src="perlin.js"></script>
    <script src="final.js"></script> <!-- final MUST come before cam -->
    <script src="cam.js"></script>
</body>
</html>
